<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qr Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app-shell">
        <header class="page-header">
            <span class="eyebrow">QUICK. SIMPLE. SHAREABLE.</span>
            <h1>QR Code Generator</h1>
            <p>Turn any link or message into a QR code in seconds.</p>
        </header>

        <section class="container" aria-label="QR code generator">
            <label for="qrtext">Your link or text</label>
            <input type="text" id="qrtext" placeholder="https://example.com" autocomplete="url">

            <div id="imgbox" aria-live="polite">
                <img src="" id="qrimg" alt="Generated QR code">
            </div>

            <button type="button" onclick="generate_qr()" class="generate">Generate QR code</button>

            <div class="download-clear">
                <button type="button" onclick="clear_qr()" class="clear">Clear</button>
                <button type="button" onclick="download_qr()" class="download">Download</button>
            </div>
        </section>
    </main>
</body>
<script src="script.js"></script>

</html>
